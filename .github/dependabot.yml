# Dependabot による依存関係の自動更新
# - github-actions: ランタイム非推奨などのアクション更新を週次でチェック
# - npm: マイナー更新が頻繁なため、全依存を 1 つの PR にまとめて月次でチェック
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ['*']
    ignore:
      # TypeScript 7 は @astrojs/check の peer 範囲 (^5 || ^6) 外で npm ci が落ちる。
      # @astrojs/check が TS 7 に対応したら外す
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node はサポートする最低の Node (package.json の engines: >=22.12.0) のメジャーに合わせる。
      # 上げると Node 22 にない API も型チェックを通ってしまう。engines を上げるときに手動で揃える
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
